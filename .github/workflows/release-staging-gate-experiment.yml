name: Release staging gate experiment
run-name: 'Staging gates: ${{ inputs.operation }}, block=${{ inputs.block_gate }}'
'on':
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: dry-run
        options:
        - dry-run
        - backfill
      block_gate:
        type: choice
        required: true
        default: none
        options:
        - none
        - build
        - prepare
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ inputs.operation }}
      tag_commit: ${{ github.sha }}
    steps:
    - run: echo 'Validate staging-only experiment; no release mutations'
  skipped-check:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
    - run: exit 1
  release-checks:
    needs:
    - skipped-check
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'Manual checks intentionally skipped'
  prepare-release:
    needs:
    - validate
    - release-checks
    if: ${{ always() && needs.validate.result == 'success' && needs.release-checks.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
    - env:
        BLOCK_GATE: ${{ inputs.block_gate }}
      run: '[[ "$BLOCK_GATE" != prepare ]]'
  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        BLOCK_GATE: ${{ inputs.block_gate }}
      run: '[[ "$BLOCK_GATE" != build ]]

        [[ "$(gh api repos/dkropachev/codex/actions/runs/38989215179 --jq .conclusion)" == success ]]'
  upload:
    name: Stage ${{ matrix.target }}
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' && needs.prepare-release.result
      == 'success' }}
    needs:
    - validate
    - build
    - prepare-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target:
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-musl
        - x86_64-apple-darwin
        - aarch64-apple-darwin
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ needs.validate.outputs.tag_commit }}
        persist-credentials: false
    - name: Download verified packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: fork-release-verified-${{ matrix.target }}
        path: dist/${{ matrix.target }}/
        run-id: 38989215179
        github-token: ${{ github.token }}
    - name: Verify downloaded package digests
      working-directory: dist/${{ matrix.target }}
      run: sha256sum --check SHA256SUMS
  finalize:
    needs:
    - validate
    - upload
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.upload.result == 'success' && needs.validate.outputs.mode
      != 'dry-run' }}
    runs-on: ubuntu-24.04
    steps:
    - run: echo 'Finalization gate reached; publication disabled in this experiment'
  assert-outcome:
    needs:
    - upload
    - finalize
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
    - env:
        OPERATION: ${{ inputs.operation }}
        BLOCK_GATE: ${{ inputs.block_gate }}
        UPLOAD: ${{ needs.upload.result }}
        FINALIZE: ${{ needs.finalize.result }}
      run: 'expected_upload=success

        expected_finalize=skipped

        if [[ "$BLOCK_GATE" != none ]]; then expected_upload=skipped; fi

        if [[ "$BLOCK_GATE" == none && "$OPERATION" == backfill ]]; then expected_finalize=success; fi

        [[ "$UPLOAD" == "$expected_upload" ]]

        [[ "$FINALIZE" == "$expected_finalize" ]]

        echo "Verified staging=$UPLOAD finalization=$FINALIZE"'
