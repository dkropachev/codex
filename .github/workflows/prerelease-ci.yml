name: pre-release-ci

# Run the same validation that gates stable release tags when a PR opts in.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  bazel:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  cargo-deny:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  sdk:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  windows-smoke-tests:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    uses: ./.github/workflows/windows-release-smoke.yml
    secrets: inherit

  results:
    name: Pre-release CI results
    needs:
      - bazel
      - cargo-deny
      - codespell
      - repo-checks
      - sdk
      - windows-smoke-tests
    if: ${{ always() && contains(github.event.pull_request.labels.*.name, 'pre-release-ci') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful pre-release checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
