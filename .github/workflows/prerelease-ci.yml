name: pre-release-ci

# Run the same validation that gates stable release tags when a PR opts in.
on:
  workflow_dispatch:
    inputs:
      uncached_tests:
        description: Execute every test instead of reusing test results
        required: false
        default: true
        type: boolean
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  bazel:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    uses: ./.github/workflows/bazel.yml
    with:
      uncached_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.uncached_tests }}
    secrets: inherit

  cargo-deny:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  sdk:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  windows-smoke-tests:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    uses: ./.github/workflows/windows-release-smoke.yml
    secrets: inherit

  packages:
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      CODEX_ZSH_MANIFEST_URL: https://github.com/openai/codex/releases/download/codex-zsh-v0.1.0/codex-zsh
      CODEX_ZSH_MANIFEST_SHA256: c534eab89dcea7e3d8a5e5b3f49c025c7c64cd4e4d9814ee24871de58a9359a1
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' codex-rs/Cargo.toml | head -n 1)"
          [[ -n "$version" ]] || { echo "Package version is missing" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-fork-release
        with:
          target: ${{ matrix.target }}
          version: ${{ steps.version.outputs.version }}

      - name: Upload dry-run packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fork-release-package-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  results:
    name: Pre-release CI results
    needs:
      - bazel
      - cargo-deny
      - codespell
      - repo-checks
      - sdk
      - windows-smoke-tests
      - packages
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pre-release-ci')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful pre-release checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
