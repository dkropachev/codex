name: Bazel test platform

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner matching the selected target
        required: true
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
      target:
        description: Rust target triple
        required: true
        default: x86_64-unknown-linux-musl
        type: choice
        options:
          [
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-musl,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            aarch64-apple-darwin,
            x86_64-apple-darwin,
          ]
      test_suite:
        description: Test coverage
        required: true
        default: full
        type: choice
        options: [full, pr]
      test_partition:
        description: Package group (use all with the PR suite)
        required: true
        default: rest
        type: choice
        options: [all, cli, execution, extensions, core, app-server, rest]
      local_test_jobs:
        description: Concurrent local test processes
        required: false
        default: 2
        type: number
      cache_test_results:
        description: Reuse cached test results
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      test_partition:
        required: false
        default: all
        type: string
      cache_test_results:
        required: false
        default: true
        type: boolean
      local_test_jobs:
        required: false
        default: 2
        type: number
      test_suite:
        required: false
        default: full
        type: string

jobs:
  test:
    name: Bazel tests on ${{ inputs.target }} (${{ inputs.test_partition }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: ${{ inputs.target }}
          cache-scope: bazel-${{ github.job }}

      - name: Check rusty_v8 MODULE.bazel checksums
        if: inputs.runner == 'ubuntu-24.04' && inputs.target == 'x86_64-unknown-linux-gnu' && (inputs.test_partition == 'all' || inputs.test_partition == 'rest')
        shell: bash
        run: |
          python3 .github/scripts/rusty_v8_bazel.py check-module-bazel
          just test-github-scripts

      - name: Check MODULE.bazel.lock is up to date
        if: inputs.runner == 'ubuntu-24.04' && inputs.target == 'x86_64-unknown-linux-gnu' && (inputs.test_partition == 'all' || inputs.test_partition == 'rest')
        shell: bash
        run: ./scripts/check-module-bazel-lock.sh

      - name: Run Bazel tests
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          # Pilot only on x86_64 Linux; ARM64 retains automatic allocation.
          CODEX_BUILDBUDDY_RESOURCE_PROFILE: ${{ inputs.target == 'x86_64-unknown-linux-gnu' && vars.CODEX_BUILDBUDDY_RESOURCE_PROFILE || 'auto' }}
          LOCAL_TEST_JOBS: ${{ inputs.local_test_jobs }}
          TEST_SUITE: ${{ inputs.test_suite }}
          TEST_PARTITION: ${{ inputs.test_partition }}
          CACHE_TEST_RESULTS: ${{ inputs.cache_test_results && 'auto' || 'no' }}
        shell: bash
        run: |
          if [[ "$TEST_SUITE" != full && "$TEST_PARTITION" != all ]]; then
            echo 'Only the full suite supports package partitions' >&2
            exit 1
          fi
          case "$TEST_SUITE" in
            pr)
              bazel_targets=(
                //codex-rs/core:core-all-test
                //codex-rs/tui:tui-unit-tests
                //codex-rs/protocol:protocol-unit-tests
                //codex-rs/app-server-protocol:app-server-protocol-unit-tests
              )
              ;;
            full)
              # These package subtrees are disjoint; rest is their complement.
              # Keep Bazel's wildcard/manual-target semantics in every group.
              execution_targets=(//codex-rs/exec-server/... //codex-rs/exec/... //codex-rs/code-mode-host/...)
              extension_targets=(//codex-rs/ext/... //codex-rs/rmcp-client/...)
              case "$TEST_PARTITION" in
                all) bazel_targets=(//...) ;;
                cli) bazel_targets=(//codex-rs/cli/...) ;;
                execution) bazel_targets=("${execution_targets[@]}") ;;
                extensions) bazel_targets=("${extension_targets[@]}") ;;
                core) bazel_targets=(//codex-rs/core/...) ;;
                app-server) bazel_targets=(//codex-rs/app-server/...) ;;
                rest)
                  bazel_targets=(//... -//codex-rs/cli/... -//codex-rs/core/... -//codex-rs/app-server/...)
                  for target in "${execution_targets[@]}" "${extension_targets[@]}"; do
                    bazel_targets+=("-$target")
                  done
                  ;;
                *) echo "Unknown test partition: $TEST_PARTITION" >&2; exit 1 ;;
              esac
              # Retain the original full-suite exclusions in every partition.
              bazel_targets+=(
                -//third_party/v8:all
                -//codex-rs/v8-poc:v8-poc-unit-tests
              )
              ;;
            *) echo "Unknown test suite: $TEST_SUITE" >&2; exit 1 ;;
          esac
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            -- \
            test \
            "--cache_test_results=${CACHE_TEST_RESULTS}" \
            "--local_test_jobs=${LOCAL_TEST_JOBS}" \
            --test_tag_filters=-argument-comment-lint \
            --test_env=RUST_TEST_THREADS=1 \
            --test_verbose_timeout_warnings \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            -- \
            "${bazel_targets[@]}"

      - name: Upload Bazel execution logs
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bazel-execution-logs-test-${{ inputs.target }}-${{ inputs.test_partition }}
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: ignore

      # Share restored repository data, with one cache writer per platform.
      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.prepare_bazel.outputs.repository-cache-hit != 'true' && (inputs.test_partition == 'all' || inputs.test_partition == 'rest')
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
