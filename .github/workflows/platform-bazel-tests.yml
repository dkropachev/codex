name: Cross-build Intel package benchmark
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  CODEX_ZSH_MANIFEST_URL: https://github.com/openai/codex/releases/download/codex-zsh-v0.1.0/codex-zsh
  CODEX_ZSH_MANIFEST_SHA256: c534eab89dcea7e3d8a5e5b3f49c025c7c64cd4e4d9814ee24871de58a9359a1
jobs:
  build:
    name: Cold Intel package on ARM Mac
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: 'off'
      TARGET: x86_64-apple-darwin
      VERSION: 0.162.1
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 13642c811330bf28cd5c3f3b4319ad00d331e64a
        fetch-depth: 0
        persist-credentials: false
    - name: Record host architecture
      run: uname -m
    - uses: ./.github/actions/build-fork-release
      with:
        target: x86_64-apple-darwin
        version: 0.162.1
    - name: Record verified package digests
      shell: bash
      working-directory: dist/x86_64-apple-darwin
      run: "python3 - <<'PY'\nimport hashlib\nimport os\nfrom pathlib import Path\n\ntarget = os.environ[\"TARGET\"]\nnames\
        \ = (f\"codex-package-{target}.tar.gz\", f\"codex-code-mode-host-{target}\")\nwith Path(\"SHA256SUMS\").open(\"w\"\
        ) as checksums:\n    for name in names:\n        digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()\n  \
        \      checksums.write(f\"{digest}  {name}\\n\")\nPY\n"
    - name: Retain verified packages
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: fork-release-verified-x86_64-apple-darwin
        path: 'dist/x86_64-apple-darwin/codex-package-x86_64-apple-darwin.tar.gz

          dist/x86_64-apple-darwin/codex-code-mode-host-x86_64-apple-darwin

          dist/x86_64-apple-darwin/SHA256SUMS

          '
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
        overwrite: true
