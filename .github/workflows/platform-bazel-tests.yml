name: Mac release LTO package comparison
run-name: 'Mac package LTO comparison: ${{ inputs.target }}'
'on':
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        default: aarch64-apple-darwin
        options:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ${{ inputs.target == 'aarch64-apple-darwin' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 20
    env:
      TARGET: ${{ inputs.target }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Set benchmark directory
      shell: bash
      run: echo "BENCH_ROOT=$RUNNER_TEMP/release-lto-benchmark" >> "$GITHUB_ENV"
    - name: Read and verify baseline package
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'mkdir -p "$BENCH_ROOT/baseline" "$BENCH_ROOT/candidate"

        gh api "repos/$GITHUB_REPOSITORY/releases/tags/rust-v0.162.1" > "$BENCH_ROOT/baseline-release.json"

        gh release download rust-v0.162.1 --repo "$GITHUB_REPOSITORY" --pattern "codex-package-$TARGET.tar.gz" --dir "$BENCH_ROOT/baseline"

        python3 - <<''PY''

        import hashlib

        import json

        import os

        from pathlib import Path

        root = Path(os.environ["BENCH_ROOT"])

        name = f"codex-package-{os.environ[''TARGET'']}.tar.gz"

        assets = json.loads((root / "baseline-release.json").read_text())["assets"]

        asset = next(item for item in assets if item["name"] == name)

        actual = "sha256:" + hashlib.sha256((root / "baseline" / name).read_bytes()).hexdigest()

        assert actual == asset["digest"], (actual, asset["digest"])

        print("Baseline release package digest verified")

        PY

        '
    - name: Download candidate verified packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: fork-release-verified-${{ inputs.target }}
        path: ${{ env.BENCH_ROOT }}/candidate
        run-id: 38991628239
        github-token: ${{ github.token }}
    - name: Verify candidate and compare both packages
      shell: bash
      working-directory: ${{ env.BENCH_ROOT }}/candidate
      run: 'shasum -a 256 --check SHA256SUMS

        mkdir -p "$BENCH_ROOT/baseline/unpacked" "$BENCH_ROOT/candidate/unpacked"

        tar -xzf "$BENCH_ROOT/baseline/codex-package-$TARGET.tar.gz" -C "$BENCH_ROOT/baseline/unpacked"

        tar -xzf "codex-package-$TARGET.tar.gz" -C "$BENCH_ROOT/candidate/unpacked"

        python3 "$GITHUB_WORKSPACE/.github/scripts/benchmark_packages.py" --baseline "$BENCH_ROOT/baseline/unpacked" --candidate
        "$BENCH_ROOT/candidate/unpacked" --samples 12 --output "$BENCH_ROOT/comparison.json"

        '
    - name: Retain comparison samples
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: mac-lto-comparison-${{ inputs.target }}
        path: ${{ env.BENCH_ROOT }}/comparison.json
        if-no-files-found: error
