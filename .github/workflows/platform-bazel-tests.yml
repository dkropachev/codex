name: Shared Bazel repository cache comparison
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  populate:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    name: populate shared GNU repository cache
    environment:
      name: bazel
      deployment: false
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Prepare Bazel CI
      id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: x86_64-unknown-linux-gnu
        cache-scope: bazel-${{ github.job }}
    - name: bazel build verify-release-build targets
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "# This job exists to compile Rust code behind\n# `cfg(not(debug_assertions))` so PR CI catches failures that would\n\
        # otherwise show up only in a release build. We do not need the full\n# optimizer and debug-info work that normally\
        \ comes with a release\n# build to get that signal, so keep Bazel in `fastbuild` and disable\n# Rust debug assertions\
        \ explicitly.\nbazel_build_args=(\n  --compilation_mode=fastbuild\n  --@rules_rust//rust/settings:extra_rustc_flag=-Cdebug-assertions=no\n\
        \  --@rules_rust//rust/settings:extra_exec_rustc_flag=-Cdebug-assertions=no\n  --build_metadata=COMMIT_SHA=${GITHUB_SHA}\n\
        \  --build_metadata=TAG_job=verify-release-build\n  --build_metadata=TAG_rust_debug_assertions=off\n)\n\nbazel_target_lines=\"\
        $(bash ./scripts/list-bazel-release-targets.sh)\"\nbazel_targets=()\nwhile IFS= read -r target; do\n  bazel_targets+=(\"\
        ${target}\")\ndone <<< \"${bazel_target_lines}\"\n\n./.github/scripts/run-bazel-ci.sh \\\n  -- \\\n  build \\\n  \"\
        ${bazel_build_args[@]}\" \\\n  -- \\\n  \"${bazel_targets[@]}\"\n"
    - name: Verify Bazel builds bwrap
      if: runner.os == 'Linux'
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "./.github/scripts/run-bazel-ci.sh \\\n  --remote-download-toplevel \\\n  --print-failed-action-summary \\\n  --\
        \ \\\n  build \\\n  --build_metadata=COMMIT_SHA=${GITHUB_SHA} \\\n  --build_metadata=TAG_job=verify-bwrap \\\n  --\
        \ \\\n  //codex-rs/bwrap:bwrap\n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: bazel-execution-logs-verify-release-build-x86_64-unknown-linux-gnu
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
  consume:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    name: consume shared GNU repository cache
    environment:
      name: bazel
      deployment: false
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Prepare Bazel CI
      id: prepare_bazel
      uses: ./.github/actions/prepare-bazel-ci
      with:
        target: x86_64-unknown-linux-gnu
        cache-scope: bazel-${{ github.job }}
    - name: Require exact cross-job cache hit
      env:
        CACHE_HIT: ${{ steps.prepare_bazel.outputs.repository-cache-hit }}
      run: test "$CACHE_HIT" = true
    - name: bazel build --config=clippy lint targets
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      shell: bash
      run: "bazel_clippy_args=(\n  --config=clippy\n  --build_metadata=COMMIT_SHA=${GITHUB_SHA}\n  --build_metadata=TAG_job=clippy\n\
        )\nbazel_target_lines=\"$(./scripts/list-bazel-clippy-targets.sh)\"\nbazel_targets=()\nwhile IFS= read -r target;\
        \ do\n  bazel_targets+=(\"${target}\")\ndone <<< \"${bazel_target_lines}\"\n\n./.github/scripts/run-bazel-ci.sh \\\
        \n  --print-failed-action-summary \\\n  -- \\\n  build \\\n  \"${bazel_clippy_args[@]}\" \\\n  -- \\\n  \"${bazel_targets[@]}\"\
        \n"
    - name: Upload Bazel execution logs
      if: always() && !cancelled()
      continue-on-error: true
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: bazel-execution-logs-clippy-x86_64-unknown-linux-gnu
        path: ${{ runner.temp }}/bazel-execution-logs
        if-no-files-found: ignore
    - name: Save bazel repository cache
      if: always() && !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.prepare_bazel.outputs.repository-cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
        key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}
    - name: Check for a clean worktree
      if: always() && !cancelled()
      uses: ./.github/actions/check-clean-worktree
    needs: populate
