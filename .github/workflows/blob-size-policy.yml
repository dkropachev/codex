name: blob-size-policy

on:
  workflow_call:

jobs:
  check:
    name: Blob size policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: openai/fence@9d10445098284f8e8bbf67495fc8c2eaa34c28c5 # pin@v0.12.7
        id: fence
        with:
          mode: audit
      - name: Diagnose Fence startup failure
        if: failure() && steps.fence.outcome == 'failure'
        env:
          FENCE_UNIT: fence-fence-${{ github.run_id }}-${{ github.run_attempt }}.service
        run: |
          sudo systemctl show "$FENCE_UNIT" \
            --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus
          sudo journalctl --unit "$FENCE_UNIT" --no-pager --lines=40
          sudo /usr/bin/systemd-run --quiet --property=Type=exec \
            --unit "fence-launch-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" /usr/bin/true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine comparison range
        id: range
        shell: bash
        run: |
          set -euo pipefail

          # PRs inspect the proposed diff; main pushes inspect only the commit
          # range that just landed. Both paths feed the same blob-size checker.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Check changed blob sizes
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          python3 scripts/check_blob_size.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --max-bytes 512000 \
            --allowlist .github/blob-size-allowlist.txt

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
