name: Windows release smoke

# Run on workflow changes so both hosted Windows runners are proven before a tag.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - codex-rs/workflows/**
      - .github/workflows/windows-release-smoke.yml
      - .github/workflows/fork-rust-release.yml

jobs:
  test:
    name: Native Windows tests — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci
        id: setup_ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Restore Cargo cache
        id: cargo_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ steps.setup_ci.outputs.cargo-target-dir }}
          key: windows-smoke-v1-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', '.github/workflows/windows-release-smoke.yml') }}-${{ github.sha }}
          restore-keys: |
            windows-smoke-v1-${{ matrix.target }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', '.github/workflows/windows-release-smoke.yml') }}-

      - name: Test Windows sandbox and protocol crates
        shell: bash
        run: |
          # These subprocess tests need a provisioned sandbox account with
          # PowerShell modules available to that account.
          just test \
            -p codex-windows-sandbox \
            -p codex-protocol \
            -p codex-app-server-protocol \
            -E 'not (package(codex-windows-sandbox) and test(unified_exec::tests::))'

      - name: Test managed workflow lifecycle on Windows
        shell: bash
        run: |
          just test -p codex-workflows \
            -E 'test(managed::store::) or test(managed::dependencies::bun::tests::materializes_private_configuration_and_isolated_directories)'

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

      - name: Save Cargo cache
        if: success() && steps.cargo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ steps.setup_ci.outputs.cargo-target-dir }}
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
