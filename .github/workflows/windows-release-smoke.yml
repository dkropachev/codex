name: Windows release smoke

# Run on workflow changes so both hosted Windows runners are proven before a tag.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-release-smoke.yml
      - .github/workflows/fork-rust-release.yml

jobs:
  test:
    name: Native Windows tests — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Test Windows sandbox and protocol crates
        shell: bash
        run: |
          # These subprocess tests need a provisioned sandbox account with
          # PowerShell modules available to that account.
          just test \
            -p codex-windows-sandbox \
            -p codex-protocol \
            -p codex-app-server-protocol \
            -E 'not (package(codex-windows-sandbox) and test(unified_exec::tests::))'

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
