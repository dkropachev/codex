name: Windows release smoke

# Run on workflow changes so both hosted Windows runners are proven before a tag.
on:
  workflow_call:
  workflow_dispatch:
  # Release tags can restore default-branch caches, but not another tag's cache.
  push:
    branches: [main]
    paths:
      - codex-rs/**
      - .github/workflows/windows-release-smoke.yml
  pull_request:
    paths:
      - codex-rs/workflows/**
      - .github/workflows/windows-release-smoke.yml
      - .github/workflows/fork-rust-release.yml

jobs:
  test:
    name: Native Windows tests — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      # The cache action accepts targets relative to workspace roots. Alias the
      # source onto the Dev Drive while retaining Cargo's existing target path.
      - name: Configure Cargo cache workspace
        id: cargo_cache_workspace
        continue-on-error: true
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:CI_BUILD_ROOT/cargo-cache-workspace" -Target $env:GITHUB_WORKSPACE | Out-Null

      - name: Cache Cargo dependencies
        if: steps.cargo_cache_workspace.outcome == 'success'
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: windows-smoke-deps-v1
          shared-key: ${{ matrix.target }}
          workspaces: ${{ env.CI_BUILD_ROOT }}/cargo-cache-workspace/codex-rs -> ../../cargo-target
          cache-bin: "false"
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Test Windows sandbox and protocol crates
        shell: bash
        run: |
          # These subprocess tests need a provisioned sandbox account with
          # PowerShell modules available to that account.
          just test \
            -p codex-windows-sandbox \
            -p codex-protocol \
            -p codex-app-server-protocol \
            -E 'not (package(codex-windows-sandbox) and test(unified_exec::tests::))'

      - name: Test managed workflow lifecycle on Windows
        shell: bash
        run: |
          just test -p codex-workflows \
            -E 'test(managed::store::) or test(managed::dependencies::bun::tests::materializes_private_configuration_and_isolated_directories)'

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
